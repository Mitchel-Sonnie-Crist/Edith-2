# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run tasks in parallel across modules.
org.gradle.parallel=true

# Cache task outputs between builds.
org.gradle.caching=true

# AndroidX is required for Compose and modern Jetpack libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resource classes each module actually needs.
android.nonTransitiveRClass=true
